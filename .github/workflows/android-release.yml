name: Android Play release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  release-bundle:
    name: Validate and build signed Play bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check signing secrets and provision temporary keystore
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (("${#missing[@]}" > 0)); then
            printf '::error::Missing GitHub Actions repository secret(s): %s\n' "${missing[*]}"
            echo "Follow docs/PLAY_RELEASE.md, add the secrets, then run this workflow again."
            exit 1
          fi

          keystore="$RUNNER_TEMP/sky-hopper-upload.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          if [[ ! -s "$keystore" ]]; then
            echo "::error::The decoded upload keystore is empty."
            exit 1
          fi
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the hosted runner Android SDK."
            exit 1
          fi
          { yes || true; } | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Enable KVM acceleration for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; release runtime validation is blocked."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::The runner still cannot read/write /dev/kvm."
            exit 1
          fi
          ls -l /dev/kvm

      - name: Run Android UI smoke test before packaging
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Build signed Android App Bundle
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify bundle and record release evidence
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$aab" ]]; then
            echo "::error::Expected release bundle was not created: $aab"
            exit 1
          fi
          verification="$RUNNER_TEMP/aab-signature-verification.txt"
          if ! jarsigner -verify "$aab" > "$verification" 2>&1 || ! grep -qi "jar verified" "$verification"; then
            echo "::error::The generated AAB did not pass the signature verification check."
            cat "$verification"
            exit 1
          fi
          mkdir -p evidence/release
          sha256sum "$aab" > evidence/release/aab-sha256.txt
          printf '{"commit":"%s","run_id":"%s","application_id":"com.teyyara.flappybirdtest","version_code":1,"version_name":"1.0","artifact":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$aab" > evidence/release/manifest.json

      - name: Upload signed Play bundle and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sky-hopper-play-release-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            evidence/release/
          if-no-files-found: error
          retention-days: 30
