name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests, lint and emulator flow
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the hosted runner Android SDK."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Run JVM tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Record candidate and APK digest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/ci
          printf '{"commit":"%s","run_id":"%s","run_attempt":"%s","runner_os":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" > evidence/ci/manifest.json
          find app/build/outputs/apk -type f -name '*.apk' -exec sha256sum {} \; > evidence/ci/apk-sha256.txt 2>/dev/null || true

      - name: Run UI flow on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sky-hopper-evidence-${{ github.sha }}
          path: |
            evidence/ci/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
